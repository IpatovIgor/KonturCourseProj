name: Prepare release for k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: cr.yandex/crp2k95esbq4ajsrt5d6

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/webapi-tests.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YCR_PUSHER_KEY }}

      - name: Publish WebAPI
        id: webapi
        uses: docker/build-push-action@v6
        with:
          context: ./Auth
          file: Auth/WebApplication1/Dockerfile
          # Yandex Container Registry rejected the OCI index with attestations.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/webapi:${{ github.sha }}

      - name: Publish Worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: ./Auth
          file: Auth/HabitTracker.Worker/Dockerfile
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/worker:${{ github.sha }}

      - name: Publish Notifications
        id: notifications
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Auth/HabitTracker.Notifications/Dockerfile
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/notifications:${{ github.sha }}

      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./habit-frontend
          file: habit-frontend/Dockerfile
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}

      - name: Set up kubectl for manifest rendering
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.2

      - name: Prepare release bundle
        id: bundle
        env:
          WEBAPI_DIGEST: ${{ steps.webapi.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          NOTIFICATIONS_DIGEST: ${{ steps.notifications.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        shell: bash
        run: |
          mkdir release
          bash deploy/k8s/render-release.sh \
            "$WEBAPI_DIGEST" "$WORKER_DIGEST" "$NOTIFICATIONS_DIGEST" "$FRONTEND_DIGEST" \
            > release/habit-tracker-release.yaml
          cp deploy/k8s/apply-release.sh release/
          printf 'commit=%s\n%s/webapi@%s\n%s/worker@%s\n%s/notifications@%s\n%s/frontend@%s\n' \
            "$GITHUB_SHA" "$REGISTRY" "$WEBAPI_DIGEST" "$REGISTRY" "$WORKER_DIGEST" \
            "$REGISTRY" "$NOTIFICATIONS_DIGEST" "$REGISTRY" "$FRONTEND_DIGEST" > release/release-digests.txt
          printf 'name=release-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: release/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_OVER_SSH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: habit-tracker-production
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: Download the published release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.bundle }}
          path: release

      - name: Apply the verified release over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || 'habit-tracker.duckdns.org' }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          main_sha=$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Skipping release $GITHUB_SHA because main has advanced to $main_sha."
            exit 0
          fi

          if [[ ! "$DEPLOY_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "Set DEPLOY_SSH_HOST to a DNS name or IPv4 address." >&2
            exit 2
          fi
          if [[ ! "$DEPLOY_SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DEPLOY_SSH_PORT > 65535 )); then
            echo "Set DEPLOY_SSH_PORT to a valid TCP port." >&2
            exit 2
          fi
          grep -Fx "commit=$GITHUB_SHA" release/release-digests.txt

          umask 077
          credentials=$(mktemp -d "$RUNNER_TEMP/habit-tracker-ssh.XXXXXX")
          trap 'rm -f -- "$credentials/key" "$credentials/known_hosts"; rmdir -- "$credentials"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY secret}" | tr -d '\r' > "$credentials/key"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS:?Set the verified SSH host key}" | tr -d '\r' > "$credentials/known_hosts"
          unset DEPLOY_SSH_KEY

          ssh_options=(-T -p "$DEPLOY_SSH_PORT" -i "$credentials/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$credentials/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          destination="habit-deploy@$DEPLOY_SSH_HOST"
          ssh -n "${ssh_options[@]}" "$destination" check
          ssh "${ssh_options[@]}" "$destination" "deploy $GITHUB_SHA" \
            < release/habit-tracker-release.yaml
