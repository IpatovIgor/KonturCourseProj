map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;

upstream webapi_backend {
    zone webapi_backend 64k;
    server webapi:80 resolve;
}

upstream notifications_backend {
    zone notifications_backend 64k;
    server notifications:80 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/api/notifications(?:/|$) {
        proxy_pass http://notifications_backend;
    }

    location ~ ^/hubs/notifications(?:/|$) {
        proxy_pass http://notifications_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        # SignalR can include the JWT in the WebSocket URL.
        access_log off;
        error_log /dev/null;
    }

    location /api/ {
        proxy_pass http://webapi_backend;
    }

    location ~ ^/(?:internal|health|metrics)(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
