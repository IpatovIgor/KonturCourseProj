services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27142:27017"
    healthcheck:
      # Initialize on a fresh test instance, then wait for the primary election.
      test:
        - CMD
        - mongosh
        - --quiet
        - mongodb://127.0.0.1:27017/?directConnection=true
        - --eval
        - |
          const hello = db.hello();
          if (hello.setName === "rs0" && hello.isWritablePrimary) quit(0);
          if (!hello.setName) {
            try {
              rs.status();
            } catch (error) {
              if (error.code !== 94) throw error;
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            }
          }
          quit(1);
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: webapi-test
      RABBITMQ_DEFAULT_PASS: webapi-test-only
      RABBITMQ_DEFAULT_VHOST: habit-tracker
    volumes:
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./deploy/rabbitmq/bootstrap.sh:/etc/rabbitmq/bootstrap.sh:ro
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: [CMD, sh, /etc/rabbitmq/bootstrap.sh]
      start_period: 180s
      interval: 10s
      timeout: 30s
      retries: 6
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [rabbitmq-monitoring]
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./deploy/rabbitmq/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/rabbitmq/prometheus-alerts.yml:/etc/prometheus/rabbitmq-alerts.yml:ro
