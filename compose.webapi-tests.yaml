services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27142:27017"
    healthcheck:
      # Initialize on a fresh test instance, then wait for the primary election.
      test:
        - CMD
        - mongosh
        - --quiet
        - mongodb://127.0.0.1:27017/?directConnection=true
        - --eval
        - |
          const hello = db.hello();
          if (hello.setName === "rs0" && hello.isWritablePrimary) quit(0);
          if (!hello.setName) {
            try {
              rs.status();
            } catch (error) {
              if (error.code !== 94) throw error;
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            }
          }
          quit(1);
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: webapi-test
      RABBITMQ_DEFAULT_PASS: webapi-test-only
      RABBITMQ_DEFAULT_VHOST: habit-tracker
    volumes:
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          bindings=$$(gosu rabbitmq rabbitmqctl -q -p habit-tracker list_bindings source_name destination_name destination_kind) || exit 1
          if printf '%s\n' "$$bindings" | awk '
            $$1 == "habit-changed-v1" && $$2 == "worker-habit-events-v1" && $$3 == "exchange" {habit=1}
            $$1 == "summary-settings-changed-v1" && $$2 == "worker-habit-events-v1" && $$3 == "exchange" {summary=1}
            $$1 == "notification-ready-v1" && $$2 == "notifications-ready-v1" && $$3 == "exchange" {ready=1}
            $$1 == "worker-habit-events-v1" && $$2 == "worker-habit-events-v1" && $$3 == "queue" {workerQueue=1}
            $$1 == "notifications-ready-v1" && $$2 == "notifications-ready-v1" && $$3 == "queue" {notificationsQueue=1}
            END {exit !(habit && summary && ready && workerQueue && notificationsQueue)}'; then
            exit 0
          fi
          # Import is asynchronous. Wait for the next check to see every binding.
          gosu rabbitmq rabbitmqctl import_definitions /etc/rabbitmq/definitions.json
          exit 1
      start_period: 180s
      interval: 10s
      timeout: 30s
      retries: 6
