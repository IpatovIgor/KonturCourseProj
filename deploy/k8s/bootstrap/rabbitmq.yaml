apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-bootstrap
rules:
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [rabbitmq-0]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [rabbitmq-0]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-bootstrap
subjects:
  - kind: ServiceAccount
    name: rabbitmq-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-bootstrap
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rabbitmq-bootstrap
      containers:
        - name: bootstrap
          image: registry.k8s.io/kubectl:v1.37.2
          args:
            - --namespace=habit-tracker
            - exec
            - rabbitmq-0
            - --container=rabbitmq
            - --
            - gosu
            - rabbitmq
            - sh
            - /etc/rabbitmq/habit-tracker/bootstrap-k8s.sh
