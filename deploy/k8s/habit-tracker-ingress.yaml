apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker
  namespace: habit-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [habit-tracker.duckdns.org]
      secretName: habit-tracker-tls
  rules:
    - host: habit-tracker.duckdns.org
      http:
        paths:
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: webapi
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker-notifications-hub
  namespace: habit-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.observability.accesslogs: "false"
    traefik.ingress.kubernetes.io/router.observability.tracing: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [habit-tracker.duckdns.org]
      secretName: habit-tracker-tls
  rules:
    - host: habit-tracker.duckdns.org
      http:
        paths:
          - path: /hubs/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: habit-tracker
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker-http
  namespace: habit-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: habit-tracker-redirect-to-https@kubernetescrd
    # The cert-manager HTTP-01 solver route must take precedence.
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: habit-tracker.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
