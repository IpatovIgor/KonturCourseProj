apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker
  namespace: habit-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [habit-tracker.example.invalid]
      secretName: habit-tracker-tls
  rules:
    - host: habit-tracker.example.invalid
      http:
        paths:
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: webapi
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker-notifications-hub
  namespace: habit-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.observability.accesslogs: "false"
    traefik.ingress.kubernetes.io/router.observability.tracing: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [habit-tracker.example.invalid]
      secretName: habit-tracker-tls
  rules:
    - host: habit-tracker.example.invalid
      http:
        paths:
          - path: /hubs/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: 80
